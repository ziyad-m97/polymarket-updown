name: ci

on:
  push:
  pull_request:

env:
  GITLEAKS_VERSION: 8.24.3

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: make check
      - run: make test
      - name: results are reproducible from the shipped data
        run: |
          make report
          git diff --exit-code -- README.md results/results.md
      - name: no secrets anywhere in the history
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --verbose .
