[project]
name = "updown"
version = "0.1.0"
description = "Research and trading system for Polymarket's 15-minute BTC Up/Down markets"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ziyad Mellal", email = "ziyad.mellal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "msgspec>=0.22.0",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
live = [
    "polymarket-client>=0.14.0",
]

[project.scripts]
updown = "updown.cli:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "PIE", "PT", "PL", "RUF",
    "N", "PERF", "TC", "PTH", "ARG", "ERA", "S", "DTZ", "TRY", "FBT", "BLE", "G",
]
ignore = ["PLR0911", "PLR0913", "PLR2004", "TRY003", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "FBT", "ARG", "PLR0915"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
